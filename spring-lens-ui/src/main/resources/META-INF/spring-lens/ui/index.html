<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Spring Lens</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="style.css">
    <script src="./src/lib/jquery-3.6.0.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'system-ui', '-apple-system', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
                    },
                    colors: {
                        primary: '#6b46c1',
                        'primary-light': '#f3f0ff',
                        'gray-50': '#f8fafc',
                        'gray-100': '#f1f5f9',
                        'gray-200': '#e2e8f0',
                        'gray-400': '#94a3b8',
                        'gray-500': '#64748b',
                        'gray-800': '#1e293b',
                        success: '#22c55e',
                        'success-light': '#dcfce7',
                        warning: '#f59e0b',
                        info: '#3b82f6',
                    }
                }
            }
        }
    </script>
    <script>
            (function () {
                const savedTheme = localStorage.getItem('theme');
                const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            })();
    </script>
</head>

<body
    class="bg-gray-50 dark:bg-slate-950 text-gray-800 dark:text-gray-100 font-sans antialiased h-screen flex overflow-hidden transition-colors duration-300">

    <!-- Sidebar -->
    <aside
        class="w-64 bg-white dark:bg-slate-900 border-r border-gray-200 dark:border-slate-800 flex flex-col h-full flex-shrink-0 transition-colors duration-300 select-none">
        <!-- Sidebar Brand Header -->
        <div class="p-5 flex items-center justify-between gap-3 border-b border-gray-100 dark:border-slate-800/80">
            <div class="flex items-center gap-3 min-w-0">
                <div
                    class="w-9 h-9 bg-gradient-to-br from-primary via-purple-600 to-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md shadow-primary/20 flex-shrink-0 border border-white/20">
                    <span class="material-symbols-outlined text-[20px]">eco</span>
                </div>
                <div class="min-w-0">
                    <h1 class="font-bold text-base tracking-tight text-gray-900 dark:text-white leading-none">
                        <a href="#/dashboard"
                            class="hover:text-primary dark:hover:text-purple-300 transition-colors">SpringLens</a>
                    </h1>
                    <div class="flex items-center gap-1.5 mt-1">
                        <span
                            class="px-1.5 py-0.5 text-[9px] font-mono font-bold bg-primary/10 text-primary dark:text-purple-300 rounded border border-primary/20">v1.0.0</span>
                        <span class="text-[10px] text-gray-400 dark:text-gray-500 font-medium">Observability</span>
                    </div>
                </div>
            </div>
            <button id="theme-toggle"
                class="w-8 h-8 flex items-center justify-center border border-gray-200 dark:border-slate-700 rounded-xl text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-100 hover:bg-gray-100 dark:hover:bg-slate-800 bg-white dark:bg-slate-900 shadow-xs transition-all cursor-pointer flex-shrink-0"
                aria-label="Toggle theme" title="Toggle dark/light theme">
                <span class="material-symbols-outlined text-[18px] dark:hidden">dark_mode</span>
                <span class="material-symbols-outlined text-[18px] hidden dark:inline">light_mode</span>
            </button>
        </div>

        <!-- Navigation Links Container -->
        <div class="flex-1 overflow-y-auto custom-scrollbar px-3 py-4 space-y-6">
            <!-- Main Navigation -->
            <div>
                <div class="px-3 pb-2 text-[10px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider">
                    Platform Overview
                </div>
                <nav class="space-y-1" aria-labelledby="core-platform-nav-tabs">
                    <a data-page="dashboard" href="#/dashboard"
                        class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:text-gray-900 hover:bg-gray-100/70 dark:text-gray-400 dark:hover:text-gray-100 dark:hover:bg-slate-800/60 rounded-xl text-xs font-semibold transition-all nav-link group">
                        <div
                            class="w-7 h-7 rounded-lg bg-gray-100 dark:bg-slate-800 flex items-center justify-center text-gray-500 dark:text-gray-400 group-hover:text-primary dark:group-hover:text-purple-300 group-[.text-primary]:text-primary dark:group-[.text-primary]:text-purple-300 group-[.text-primary]:bg-primary/10 dark:group-[.text-primary]:bg-purple-950/50 transition-colors flex-shrink-0">
                            <span class="material-symbols-outlined text-[18px]">dashboard</span>
                        </div>
                        <span>Dashboard</span>
                    </a>
                </nav>
            </div>

            <!-- Beans Navigation -->
            <div>
                <div class="px-3 pb-2 text-[10px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider">
                    Bean Ecosystem
                </div>
                <nav class="space-y-1" aria-labelledby="bean-ecosystem-nav-tabs">
                    <div class="menu-group">
                        <button type="button"
                            class="w-full flex items-center justify-between px-3 py-2.5 text-gray-600 hover:text-gray-900 hover:bg-gray-100/70 dark:text-gray-400 dark:hover:text-gray-100 dark:hover:bg-slate-800/60 rounded-xl text-xs font-semibold transition-all parent-link group cursor-pointer text-left">
                            <div class="flex items-center gap-3">
                                <div
                                    class="w-7 h-7 rounded-lg bg-purple-50 dark:bg-purple-950/40 text-primary dark:text-purple-300 flex items-center justify-center border border-primary/10 flex-shrink-0">
                                    <span class="material-symbols-outlined text-[20px]">eco</span>
                                </div>
                                <span>Bean Engine</span>
                            </div>
                            <span
                                class="material-symbols-outlined text-[18px] transition-transform duration-200 chevron-icon text-gray-400">expand_more</span>
                        </button>
                        <div
                            class="submenu ml-4 pl-3 border-l border-gray-100 dark:border-slate-800/80 space-y-1 mt-1.5 hidden">
                            <a data-page="definitions" href="#/definitions"
                                class="flex items-center gap-2.5 text-xs font-medium text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-gray-100 py-2 px-2.5 rounded-lg hover:bg-gray-100/70 dark:hover:bg-slate-800/60 transition-all nav-link group">
                                <span
                                    class="material-symbols-outlined text-[17px] text-gray-400 dark:text-gray-500 group-hover:text-primary dark:group-hover:text-purple-300 group-[.text-primary]:text-primary dark:group-[.text-primary]:text-purple-300 transition-colors">list_alt</span>
                                <span>Definitions</span>
                            </a>
                            <a data-page="instances" href="#/instances"
                                class="flex items-center gap-2.5 text-xs font-medium text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-gray-100 py-2 px-2.5 rounded-lg hover:bg-gray-100/70 dark:hover:bg-slate-800/60 transition-all nav-link group">
                                <span
                                    class="material-symbols-outlined text-[17px] text-gray-400 dark:text-gray-500 group-hover:text-primary dark:group-hover:text-purple-300 group-[.text-primary]:text-primary dark:group-[.text-primary]:text-purple-300 transition-colors">timelapse</span>
                                <span>Instances</span>
                            </a>
                            <a data-page="conditions" href="#/conditions"
                                class="flex items-center gap-2.5 text-xs font-medium text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-gray-100 py-2 px-2.5 rounded-lg hover:bg-gray-100/70 dark:hover:bg-slate-800/60 transition-all nav-link group">
                                <span
                                    class="material-symbols-outlined text-[17px] text-gray-400 dark:text-gray-500 group-hover:text-primary dark:group-hover:text-purple-300 group-[.text-primary]:text-primary dark:group-[.text-primary]:text-purple-300 transition-colors">fact_check</span>
                                <span>Condition Reports</span>
                            </a>
                            <a data-page="graph" href="#/graph"
                                class="flex items-center gap-2.5 text-xs font-medium text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-gray-100 py-2 px-2.5 rounded-lg hover:bg-gray-100/70 dark:hover:bg-slate-800/60 transition-all nav-link group">
                                <span
                                    class="material-symbols-outlined text-[17px] text-gray-400 dark:text-gray-500 group-hover:text-primary dark:group-hover:text-purple-300 group-[.text-primary]:text-primary dark:group-[.text-primary]:text-purple-300 transition-colors">hub</span>
                                <span>Dependency Graph</span>
                            </a>
                        </div>
                    </div>
                </nav>
            </div>
        </div>

        <!-- Sidebar Footer Status Card -->
        <div id="sidebar-status-container"
            class="p-3 border-t border-gray-100 dark:border-slate-800/80 mt-auto bg-gray-50/50 dark:bg-slate-900/50">
            <div
                class="p-3 rounded-xl bg-white dark:bg-slate-800/60 border border-gray-200/80 dark:border-slate-700/60 shadow-xs flex items-center justify-between transition-colors">
                <div class="flex items-center gap-2 min-w-0">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse flex-shrink-0"></span>
                    <div class="min-w-0">
                        <div class="text-[11px] font-bold text-gray-800 dark:text-gray-200 truncate">Service Active
                        </div>
                        <div class="text-[9px] text-gray-400 dark:text-gray-500 font-mono truncate">Health Status: UP
                        </div>
                    </div>
                </div>
                <span
                    class="px-1.5 py-0.5 rounded text-[9px] font-bold font-mono bg-emerald-50 text-emerald-600 dark:bg-emerald-950/40 dark:text-emerald-400 border border-emerald-200/60 dark:border-emerald-800/60">HEALTHY</span>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main id="main-content"
        class="flex-1 flex flex-col min-w-0 overflow-hidden bg-gray-50 dark:bg-slate-950 transition-colors duration-300">

    </main>

    <!-- Global App Templates -->
    <template id="tpl-page-header">
        <header
            class="bg-white dark:bg-slate-900 border-b border-gray-200 dark:border-slate-800 px-6 sm:px-8 py-4 flex items-center justify-between z-10 flex-shrink-0 h-[72px] transition-colors duration-300">
            <div class="flex items-center gap-3 min-w-0">
                <div
                    class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary/20 via-purple-500/10 to-indigo-500/20 text-primary dark:text-purple-300 flex items-center justify-center border border-primary/20 shadow-xs flex-shrink-0"
                    data-header-field="iconContainer">
                    <span class="material-symbols-outlined text-[22px]" data-header-field="icon">widgets</span>
                </div>
                <div class="min-w-0">
                    <div class="flex items-center gap-2">
                        <h1 class="text-lg font-bold text-gray-900 dark:text-white tracking-tight truncate"
                            data-header-field="title">Page Title</h1>
                        <span
                            class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-purple-50 text-primary border border-primary/20 dark:bg-purple-950/40 dark:text-purple-300 flex-shrink-0 hidden"
                            data-header-field="badge"></span>
                    </div>
                    <div class="text-xs text-gray-500 dark:text-gray-400 font-medium flex items-center gap-1 truncate"
                        data-header-field="breadcrumbs">
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2.5 flex-shrink-0" data-header-field="actions">
                <!-- Action items populated dynamically -->
            </div>
        </header>
    </template>

    <template id="tpl-page-header-btn">
        <button
            class="flex items-center gap-1.5 px-3 py-1.5 border border-gray-200 dark:border-slate-700 rounded-xl text-xs font-semibold text-gray-700 dark:text-gray-200 bg-white dark:bg-slate-800 hover:bg-gray-50 dark:hover:bg-slate-700/80 hover:border-gray-300 dark:hover:border-slate-600 shadow-xs transition-all cursor-pointer">
            <span class="material-symbols-outlined text-[16px] text-gray-500 dark:text-gray-400" data-btn-field="icon"></span>
            <span data-btn-field="label"></span>
        </button>
    </template>

    <template id="tpl-page-header-search">
        <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-3 text-gray-400 dark:text-gray-500 text-[18px]">search</span>
            <input type="text"
                class="pl-9 pr-4 py-1.5 bg-white dark:bg-slate-950 border border-gray-200 dark:border-slate-800 text-gray-800 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 rounded-xl text-xs font-medium focus:outline-none focus:ring-2 focus:ring-primary/25 focus:border-primary transition-all w-64 shadow-xs" />
        </div>
    </template>
    <template id="tpl-status-connected">
        <div
            class="p-3 rounded-xl bg-white dark:bg-slate-800/60 border border-gray-200/80 dark:border-slate-700/60 shadow-xs flex items-center justify-between transition-colors">
            <div class="flex items-center gap-2 min-w-0">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse flex-shrink-0"></span>
                <div class="min-w-0">
                    <div class="text-[11px] font-bold text-gray-800 dark:text-gray-200 truncate">Service Active</div>
                    <div class="text-[9px] text-gray-400 dark:text-gray-500 font-mono truncate">Health Status: UP</div>
                </div>
            </div>
            <span
                class="px-1.5 py-0.5 rounded text-[9px] font-bold font-mono bg-emerald-50 text-emerald-600 dark:bg-emerald-950/40 dark:text-emerald-400 border border-emerald-200/60 dark:border-emerald-800/60">HEALTHY</span>
        </div>
    </template>

    <template id="tpl-status-disconnected">
        <div
            class="p-3 rounded-xl bg-white dark:bg-slate-800/60 border border-gray-200/80 dark:border-slate-700/60 shadow-xs flex items-center justify-between transition-colors">
            <div class="flex items-center gap-2 min-w-0">
                <span class="w-2 h-2 rounded-full bg-rose-500 flex-shrink-0"></span>
                <div class="min-w-0">
                    <div class="text-[11px] font-bold text-gray-800 dark:text-gray-200 truncate">Service Inactive</div>
                    <div class="text-[9px] text-gray-400 dark:text-gray-500 font-mono truncate">Health Status: DOWN
                    </div>
                </div>
            </div>
            <span
                class="px-1.5 py-0.5 rounded text-[9px] font-bold font-mono bg-rose-50 text-rose-600 dark:bg-rose-950/40 dark:text-rose-400 border border-rose-200/60 dark:border-rose-800/60">OFFLINE</span>
        </div>
    </template>

    <template id="tpl-app-loading">
        <div class="flex flex-col items-center justify-center h-full gap-3 py-24">
            <span class="animate-spin rounded-full h-10 w-10 border-4 border-primary border-t-transparent"></span>
            <span class="text-xs font-semibold text-gray-400 dark:text-gray-500">Loading module...</span>
        </div>
    </template>

    <template id="tpl-app-error">
        <div
            class="flex flex-col items-center justify-center h-full p-8 text-center bg-white dark:bg-slate-900 m-6 rounded-xl border border-gray-200 dark:border-slate-800 shadow-sm transition-colors duration-300">
            <span class="material-symbols-outlined text-red-500 text-5xl mb-4">error</span>
            <h3 class="text-lg font-bold text-gray-800 dark:text-white mb-1">Application Error</h3>
            <p class="text-sm text-gray-500 dark:text-gray-400 max-w-sm mb-2">Could not load this module. Please ensure
                the backend is active.</p>
            <p class="text-[10px] text-red-500 dark:text-red-400 font-mono mb-4 bg-red-50/50 dark:bg-red-950/20 border border-red-100 dark:border-red-900/30 rounded px-2 py-1 select-all"
                data-field="message"></p>
            <button id="retry-load-btn"
                class="px-4 py-2 bg-primary hover:bg-primary/95 text-white rounded-md text-sm font-semibold transition-colors">Retry</button>
        </div>
    </template>

    <template id="tpl-tooltip">
        <div id="tip"
            class="absolute hidden bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border border-gray-200/80 dark:border-slate-800 rounded-2xl p-3.5 shadow-2xl pointer-events-none z-50 text-xs min-w-[200px] max-w-[320px] transition-all duration-150">
            <div class="flex items-center gap-2 mb-2 pb-2 border-b border-gray-100 dark:border-slate-800/80">
                <div
                    class="w-6 h-6 rounded-lg bg-primary/10 dark:bg-purple-950/40 text-primary dark:text-purple-300 flex items-center justify-center flex-shrink-0 border border-primary/20">
                    <span class="material-symbols-outlined text-[15px]">data_object</span>
                </div>
                <div id="tip-name" class="font-bold text-gray-900 dark:text-white font-mono text-[11.5px] truncate">
                </div>
            </div>
            <div class="space-y-1.5 text-[11px]">
                <div id="tip-type" class="text-gray-700 dark:text-gray-300 font-mono break-all leading-tight"></div>
                <div id="tip-scope" class="text-gray-500 dark:text-gray-400 font-medium"></div>
                <div id="tip-meta" class="text-primary dark:text-purple-300 font-semibold text-[10.5px]"></div>
            </div>
        </div>
    </template>

    <!-- Global Toast Templates -->
    <template id="tpl-toast-container">
        <div id="sl-toast-container"
            class="fixed top-5 right-5 z-[99999] flex flex-col gap-3 max-w-sm sm:max-w-md w-full pointer-events-none px-4 sm:px-0"
            aria-live="polite" aria-atomic="true">
        </div>
    </template>

    <template id="tpl-toast-item">
        <div
            class="pointer-events-auto relative group overflow-hidden bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border border-gray-200/90 dark:border-slate-800/90 rounded-2xl shadow-xl shadow-slate-950/10 dark:shadow-black/40 transform translate-x-8 opacity-0 scale-95 transition-all duration-300 ease-out flex flex-col">

            <!-- Main Body -->
            <div class="p-4 flex items-start gap-3.5">
                <!-- Accent Icon Avatar -->
                <div class="w-10 h-10 rounded-xl border flex items-center justify-center flex-shrink-0 shadow-xs mt-0.5"
                    data-field="iconAvatar">
                    <span class="material-symbols-outlined text-[20px]" data-field="iconName"></span>
                </div>

                <!-- Content Details -->
                <div class="flex-1 min-w-0 pr-1">
                    <div class="flex items-center gap-2 mb-1" data-field="titleContainer">
                        <h4 class="text-xs font-bold text-gray-900 dark:text-white tracking-tight" data-field="title">
                        </h4>
                    </div>
                    <div class="text-xs text-gray-600 dark:text-gray-300 leading-relaxed break-words"
                        data-field="message"></div>

                    <div class="mt-2.5 pt-2 border-t border-gray-100 dark:border-slate-800"
                        data-field="actionContainer">
                        <button type="button"
                            class="btn-toast-action px-3 py-1 text-white rounded-lg text-[11px] font-bold shadow-xs hover:opacity-95 active:scale-95 transition-all cursor-pointer"
                            data-field="actionButton">
                        </button>
                    </div>
                </div>

                <!-- Close Button -->
                <button type="button"
                    class="btn-toast-close w-7 h-7 rounded-lg flex items-center justify-center text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-slate-800 transition-colors -mr-1 -mt-1 flex-shrink-0 cursor-pointer"
                    title="Dismiss notification">
                    <span class="material-symbols-outlined text-[17px]">close</span>
                </button>
            </div>

            <!-- Interactive Progress Countdown Bar -->
            <div class="h-[3px] w-full bg-gray-100 dark:bg-slate-800/80 overflow-hidden relative flex-shrink-0"
                data-field="progressContainer">
                <div class="toast-progress-bar h-full rounded-r-full"
                    style="width: 100%; transform-origin: left center;" data-field="progressBar"></div>
            </div>
        </div>
    </template>

    <!-- Global Pagination Templates -->
    <template id="tpl-pagination-btn-nav">
        <button
            class="w-7 h-7 flex items-center justify-center rounded text-xs border border-gray-200 dark:border-slate-800 text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-slate-800 font-medium cursor-pointer">
            <span class="material-symbols-outlined text-[16px]"></span>
        </button>
    </template>

    <template id="tpl-pagination-btn-page">
        <button class="w-7 h-7 flex items-center justify-center rounded text-xs btn-page cursor-pointer"
            data-action="change-page"></button>
    </template>

    <template id="tpl-pagination-ellipsis">
        <span class="w-7 h-7 flex items-center justify-center text-xs text-gray-400 font-medium select-none">...</span>
    </template>

    <!-- Global Bean Details Sidebar Template -->
    <template id="tpl-bean-details-sidebar">
        <div class="flex flex-col h-full w-full min-w-0">
            <!-- Header -->
            <div
                class="px-4 py-3.5 border-b border-gray-100 dark:border-slate-800 flex items-center justify-between bg-gradient-to-r from-purple-50/60 via-indigo-50/30 to-transparent dark:from-purple-950/20 dark:via-slate-900/40 dark:to-transparent flex-shrink-0">
                <div class="flex items-center gap-2.5 min-w-0">
                    <div
                        class="w-8 h-8 rounded-xl bg-gradient-to-br from-primary/20 via-purple-500/15 to-transparent text-primary dark:text-purple-300 flex items-center justify-center ring-1 ring-primary/25 shadow-2xs flex-shrink-0">
                        <span class="material-symbols-outlined text-[18px]">manage_search</span>
                    </div>
                    <div class="min-w-0">
                        <div class="flex items-center gap-1.5 flex-wrap">
                            <h3 class="font-black text-xs text-gray-900 dark:text-white uppercase tracking-wider truncate">Bean Inspector</h3>
                            <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-md text-[9px] font-bold bg-purple-50 text-primary border border-purple-200/80 dark:bg-purple-950/40 dark:text-purple-300 dark:border-purple-800/40">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>Active
                            </span>
                        </div>
                        <p class="text-[10.5px] text-gray-400 dark:text-gray-500 font-medium truncate">Definition & Metadata Explorer</p>
                    </div>
                </div>
                <button data-action="close-sidebar"
                    class="w-8 h-8 rounded-xl flex items-center justify-center text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-slate-800 transition-all cursor-pointer group flex-shrink-0"
                    id="btn-close-sidebar" title="Close sidebar">
                    <span class="material-symbols-outlined text-[18px] group-hover:rotate-90 transition-transform duration-200">close</span>
                </button>
            </div>
