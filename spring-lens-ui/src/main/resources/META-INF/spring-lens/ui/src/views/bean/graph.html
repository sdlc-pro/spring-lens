<div class="flex flex-col h-full w-full max-w-full overflow-hidden p-4 sm:p-6 gap-4">
    <!-- Top Toolbar Header -->
    <header
        class="bg-white dark:bg-slate-900 border border-gray-200/80 dark:border-slate-800 rounded-2xl p-3.5 px-5 flex items-center justify-between gap-3 shadow-sm transition-colors duration-300 relative z-30 flex-shrink-0">
        <div class="flex items-center gap-3 flex-shrink-0 flex-wrap">
            <!-- Search Box with Suggestions -->
            <div class="relative flex items-center">
                <span
                    class="material-symbols-outlined absolute left-3 text-gray-400 dark:text-gray-500 text-[18px]">search</span>
                <input type="text" id="search-input" placeholder="Search bean in graph..."
                    class="pl-9 pr-3 py-1.5 bg-white dark:bg-slate-950 border border-gray-200 dark:border-slate-800 text-gray-800 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 rounded-xl text-xs font-medium focus:outline-none focus:ring-2 focus:ring-primary/25 focus:border-primary transition-all w-44 focus:w-60 shadow-xs" />
                <div id="search-suggestions"
                    class="absolute left-0 top-full mt-1.5 bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-800 rounded-xl shadow-xl max-h-72 w-80 overflow-y-auto custom-scrollbar z-50 text-xs hidden">
                </div>
            </div>

            <!-- Context Filter Dropdown (hidden if single context) -->
            <div id="context-filter-container" class="relative items-center hidden group">
                <div class="absolute left-2.5 flex items-center pointer-events-none text-primary dark:text-purple-400">
                    <span class="material-symbols-outlined text-[16px]">domain</span>
                </div>
                <select id="context-filter"
                    class="pl-8 pr-8 py-1.5 bg-white dark:bg-slate-950 border border-gray-200/90 dark:border-slate-800 text-gray-700 dark:text-gray-200 rounded-xl text-xs font-semibold hover:border-primary/50 dark:hover:border-primary/50 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all cursor-pointer shadow-xs appearance-none">
                    <option value="">All Contexts</option>
                </select>
                <div class="absolute right-2.5 flex items-center pointer-events-none text-gray-400 dark:text-gray-500 group-hover:text-gray-600 dark:group-hover:text-gray-300 transition-colors">
                    <span class="material-symbols-outlined text-[16px]">expand_more</span>
                </div>
            </div>

            <div class="h-5 w-px bg-gray-200 dark:bg-slate-800 mx-0.5 hidden sm:block"></div>

            <!-- Collapse Button -->
            <button
                class="flex items-center gap-1.5 px-3 py-1.5 border border-gray-200 dark:border-slate-700 rounded-xl text-xs font-semibold text-gray-700 dark:text-gray-200 bg-white dark:bg-slate-800 hover:bg-gray-50 dark:hover:bg-slate-700/80 hover:border-gray-300 dark:hover:border-slate-600 shadow-xs transition-all cursor-pointer whitespace-nowrap"
                id="btn-collapse" title="Collapse All Nodes">
                <span class="material-symbols-outlined text-[16px] text-gray-500 dark:text-gray-400">unfold_less</span>
                Collapse
            </button>

            <!-- Reset Button -->
            <button
                class="flex items-center gap-1.5 px-3 py-1.5 border border-gray-200 dark:border-slate-700 rounded-xl text-xs font-semibold text-gray-700 dark:text-gray-200 bg-white dark:bg-slate-800 hover:bg-gray-50 dark:hover:bg-slate-700/80 hover:border-gray-300 dark:hover:border-slate-600 shadow-xs transition-all cursor-pointer whitespace-nowrap"
                id="btn-reset" title="Reset View & Graph">
                <span
                    class="material-symbols-outlined text-[16px] text-gray-500 dark:text-gray-400">center_focus_strong</span>
                Reset
            </button>

            <!-- Layout Toggle group -->
            <div
                class="flex items-center border border-gray-200 dark:border-slate-800 rounded-xl bg-gray-50/80 dark:bg-slate-950 p-1 whitespace-nowrap shadow-xs">
                <button
                    class="px-2.5 py-1 text-xs font-bold rounded-lg transition-all cursor-pointer flex items-center gap-1 bg-white dark:bg-slate-800 text-gray-800 dark:text-white shadow-xs"
                    id="btn-tb" title="Top → Bottom Layout">
                    <span class="material-symbols-outlined text-[15px]">south</span> Top-Down
                </button>
                <button
                    class="px-2.5 py-1 text-xs font-semibold rounded-lg transition-all cursor-pointer flex items-center gap-1 text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-white"
                    id="btn-lr" title="Left → Right Layout">
                    <span class="material-symbols-outlined text-[15px]">east</span> Left-Right
                </button>
            </div>

            <!-- Node Style Mode Toggle group -->
            <div
                class="flex items-center border border-gray-200 dark:border-slate-800 rounded-xl bg-gray-50/80 dark:bg-slate-950 p-1 whitespace-nowrap shadow-xs">
                <button
                    class="px-2.5 py-1 text-xs font-bold rounded-lg transition-all cursor-pointer flex items-center gap-1 bg-white dark:bg-slate-800 text-gray-800 dark:text-white shadow-xs"
                    id="btn-node-theme-tint" title="Soft Tinted Node Style">
                    <span class="material-symbols-outlined text-[15px]">palette</span> Tint
                </button>
                <button
                    class="px-2.5 py-1 text-xs font-semibold rounded-lg transition-all cursor-pointer flex items-center gap-1 text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-white"
                    id="btn-node-theme-badge" title="Card with Icon Badge Style">
                    <span class="material-symbols-outlined text-[15px]">view_quilt</span> Badge
                </button>
            </div>

            <!-- Highlight Path Button -->
            <button
                class="flex items-center gap-1.5 px-3 py-1.5 border border-gray-200 dark:border-slate-700 rounded-xl text-xs font-semibold text-gray-700 dark:text-gray-200 bg-white dark:bg-slate-800 hover:bg-gray-50 dark:hover:bg-slate-700/80 hover:border-gray-300 dark:hover:border-slate-600 shadow-xs transition-all cursor-pointer whitespace-nowrap"
                id="btn-highlight-path" title="Toggle Path Highlighting">
                <span class="material-symbols-outlined text-[16px] text-purple-500 dark:text-purple-400">insights</span>
                Highlight Path
            </button>
        </div>

        <!-- Toolbar Right Statuses -->
        <div
            class="flex items-center gap-2.5 text-xs font-medium text-gray-600 dark:text-gray-300 flex-shrink-0 whitespace-nowrap">
            <!-- Chunk Loading Progress Badge -->
            <div id="chunk-progress-badge"
                class="flex items-center gap-1.5 bg-amber-50 dark:bg-amber-950/30 text-amber-700 dark:text-amber-300 px-3 py-1.5 rounded-xl border border-amber-200/80 dark:border-amber-900/40 transition-all shadow-xs">
                <span id="chunk-progress-dot" class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                <span><strong id="chunk-progress-text" class="font-bold font-mono">0 / 0</strong></span>
            </div>

            <!-- Manual Reload / Retry Button -->
            <button id="btn-reload-graph"
                class="flex items-center gap-1.5 px-3 py-1.5 bg-white dark:bg-slate-800 text-gray-700 dark:text-gray-200 hover:text-gray-900 dark:hover:text-white border border-gray-200 dark:border-slate-700 rounded-xl shadow-xs hover:bg-gray-50 dark:hover:bg-slate-700/80 transition-all cursor-pointer font-semibold"
                title="Reload Graph Data">
                <span class="material-symbols-outlined text-[16px] text-gray-500 dark:text-gray-400">refresh</span>
                <span>Reload</span>
            </button>

            <!-- Beans Count Pill -->
            <div
                class="flex items-center gap-1.5 bg-primary/10 dark:bg-purple-950/40 text-primary dark:text-purple-300 px-3 py-1.5 rounded-xl border border-primary/20 shadow-xs font-semibold">
                <span class="w-2 h-2 rounded-full bg-primary animate-none"></span>
                <span>Beans: <strong id="beans-count" class="font-bold font-mono">0</strong></span>
            </div>
        </div>
    </header>

    <!-- Main Content Flex Row (Graph Card + Smooth Sliding Sidebar Drawer) -->
    <div class="flex flex-1 gap-4 min-h-0 relative items-stretch">
        <!-- Left: Main Graph Area (Canvas Box) -->
        <main
            class="relative flex-1 bg-white dark:bg-slate-900 border border-gray-200/80 dark:border-slate-800 rounded-2xl overflow-hidden shadow-sm h-full min-h-[500px] transition-all duration-300 ease-in-out">
            <div id="beanGraph" class="w-full h-full min-h-[500px]">
                <svg id="tree-svg" class="w-full h-full min-h-[500px]"></svg>
            </div>

            <!-- Navigation Controls floating in bottom-left -->
            <div
                class="absolute bottom-5 left-5 flex flex-col gap-1 bg-white/90 dark:bg-slate-900/90 backdrop-blur-sm border border-gray-200 dark:border-slate-800 rounded-2xl p-1.5 shadow-lg z-10">
                <button
                    class="w-8 h-8 flex items-center justify-center text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-white hover:bg-gray-50 dark:hover:bg-slate-800 rounded-xl transition-colors cursor-pointer"
                    id="btn-pan-mode" title="Fit View">
                    <span class="material-symbols-outlined text-[18px]">fit_screen</span>
                </button>
                <button
                    class="w-8 h-8 flex items-center justify-center text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-white hover:bg-gray-50 dark:hover:bg-slate-800 rounded-xl transition-colors cursor-pointer"
                    id="btn-control-zoom-in" title="Zoom In">
                    <span class="material-symbols-outlined text-[18px]">add</span>
                </button>
                <button
                    class="w-8 h-8 flex items-center justify-center text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-white hover:bg-gray-50 dark:hover:bg-slate-800 rounded-xl transition-colors cursor-pointer"
                    id="btn-control-zoom-out" title="Zoom Out">
                    <span class="material-symbols-outlined text-[18px]">remove</span>
                </button>
                <button
                    class="w-8 h-8 flex items-center justify-center text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-white hover:bg-gray-50 dark:hover:bg-slate-800 rounded-xl transition-colors cursor-pointer"
                    id="btn-control-fit" title="Toggle Scale">
                    <span class="material-symbols-outlined text-[18px]">aspect_ratio</span>
                </button>
            </div>

            <!-- Legend Panel in bottom-right -->
            <div
                class="absolute bottom-5 right-5 bg-white/90 dark:bg-slate-900/90 backdrop-blur-sm border border-gray-200 dark:border-slate-800 rounded-2xl p-3.5 shadow-lg z-10 flex flex-col gap-2.5 text-[11px] text-gray-600 dark:text-gray-400 w-40">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-blue-500 shadow-xs shadow-blue-500/30"></span>
                    <span class="font-bold text-gray-800 dark:text-gray-200">Root Bean</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-xs shadow-emerald-500/30"></span>
                    <span>Intermediate</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-amber-500 shadow-xs shadow-amber-500/30"></span>
                    <span>Leaf Bean</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-purple-500 shadow-xs shadow-purple-500/30"></span>
                    <span>Adapter Bean</span>
                </div>
            </div>
        </main>

        <!-- Right: Details Sidebar (Smooth Width Transition Drawer) -->
        <aside
            class="transition-all duration-300 ease-in-out w-0 max-w-0 opacity-0 pointer-events-none -mr-4 border-0 bg-white dark:bg-slate-900 border-gray-200/80 dark:border-slate-800 rounded-2xl shadow-lg flex flex-col flex-shrink-0 sticky top-0 overflow-hidden h-full"
            id="details-sidebar">
        </aside>
    </div>
</div>

<template id="tpl-graph-dep-empty">
    <div class="text-gray-400 text-xs py-2 px-1" data-field="message"></div>
</template>

<template id="tpl-graph-dep-item">
    <div
        class="flex items-center gap-2 py-2 px-2 text-xs border-b border-gray-50 dark:border-slate-800/60 last:border-b-0">
        <span class="w-2 h-2 rounded-full flex-shrink-0" data-field="dot"></span>
        <span class="font-mono text-[11px] text-gray-700 dark:text-gray-300 break-all" data-field="name"></span>
    </div>
</template>

<template id="tpl-suggestion-item">
    <div
        class="suggestion-item p-2.5 hover:bg-purple-50/60 dark:hover:bg-purple-950/30 cursor-pointer transition-colors border-b border-gray-50 dark:border-slate-800/50 last:border-b-0">
        <strong class="text-xs font-semibold text-gray-700 dark:text-gray-300 block" data-field="name"></strong>
    </div>
</template>

<template id="tpl-bean-graph-error">
    <div class="p-5 text-red-500 font-semibold flex items-center gap-2">
        <span>❌ Failed to load bean definitions:</span>
        <span data-field="errorMessage"></span>
    </div>
</template>
